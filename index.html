<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Drawing App - Neon Glow</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #app-container {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        #webcam {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            object-fit: cover;
            opacity: 0.25;
            z-index: 1;
        }

        #paintCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 2;
            background: transparent;
        }

        #toolbar {
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 30px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="color"] {
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        input[type="range"] {
            cursor: pointer;
            accent-color: #00ffcc;
        }

        #status-indicator {
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 15px;
            background: #444;
            transition: all 0.3s ease;
        }

        .status-draw { color: #00ffcc; text-shadow: 0 0 8px #00ffcc; }
        .status-erase { color: #ff0055; text-shadow: 0 0 8px #ff0055; }
        .status-pause { color: #ffcc00; text-shadow: 0 0 8px #ffcc00; }
        
        #loading {
            position: absolute;
            color: #fff;
            font-size: 1.2rem;
            z-index: 100;
            background: rgba(0,0,0,0.85);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #instructions-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 5;
            background: rgba(15, 15, 15, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 204, 0.2);
            padding: 15px 20px;
            border-radius: 10px;
            max-width: 280px;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        #instructions-overlay h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            letter-spacing: 1.5px;
            color: #00ffcc;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.4);
            text-transform: uppercase;
        }

        .instruction-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            color: #e0e0e0;
        }

        .instruction-item:last-child {
            margin-bottom: 0;
        }

        .gesture-key {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 11px;
            margin-right: 10px;
            min-width: 65px;
            text-align: center;
            text-transform: uppercase;
        }

        .key-draw { color: #00ffcc; border-color: rgba(0, 255, 204, 0.4); }
        .key-erase { color: #ff0055; border-color: rgba(255, 0, 85, 0.4); }
        .key-pause { color: #ffcc00; border-color: rgba(255, 204, 0, 0.4); }

        #credit-badge {
            position: absolute;
            bottom: 15px;
            right: 15px;
            z-index: 20;
            background: rgba(20, 20, 20, 0.75);
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        #credit-badge span {
            color: #00ffcc;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.5);
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <div class="control-group">
            <label for="colorPicker">Color:</label>
            <input type="color" id="colorPicker" value="#00ffcc">
        </div>
        
        <div class="control-group">
            <label for="brushSize">Size:</label>
            <input type="range" id="brushSize" min="5" max="40" value="15">
        </div>

        <div class="control-group">
            <label>Mode:</label>
            <span id="status-indicator" class="status-pause">LOADING...</span>
        </div>
    </div>

    <div id="app-container">
        <div id="loading">
            <div id="loading-text">Initializing Camera & AI Tracking...</div>
            <small style="color: #aaa; font-size: 0.8rem; margin-top: 5px;">Please allow camera permissions when prompted.</small>
        </div>
        
        <div id="instructions-overlay">
            <h3>Gesture Guide</h3>
            <div class="instruction-item">
                <span class="gesture-key key-draw">Draw</span>
                <span>Raise Index Finger only</span>
            </div>
            <div class="instruction-item">
                <span class="gesture-key key-erase">Erase</span>
                <span>Open your entire hand</span>
            </div>
            <div class="instruction-item">
                <span class="gesture-key key-pause">Pause</span>
                <span>Make a tight closed fist</span>
            </div>
        </div>

        <video id="webcam" autoplay playsinline></video>
        <canvas id="paintCanvas"></canvas>
        
        <div id="credit-badge">Made by <span>Vihaan DK</span></div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('paintCanvas');
        const ctx = canvasElement.getContext('2d');
        const statusIndicator = document.getElementById('status-indicator');
        const loadingScreen = document.getElementById('loading');
        const loadingText = document.getElementById('loading-text');
        
        const colorPicker = document.getElementById('colorPicker');
        const brushSizeSlider = document.getElementById('brushSize');

        let lastX = null;
        let lastY = null;

        // Persistent offscreen backup context 
        const drawingCanvas = document.createElement('canvas');
        const drawCtx = drawingCanvas.getContext('2d');

        function resizeCanvas() {
            canvasElement.width = 800;
            canvasElement.height = 600;
            drawingCanvas.width = 800;
            drawingCanvas.height = 600;
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
        }
        resizeCanvas();

        function getDistance(pt1, pt2) {
            return Math.sqrt(Math.pow(pt1.x - pt2.x, 2) + Math.pow(pt1.y - pt2.y, 2));
